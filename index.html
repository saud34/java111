<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أساسيات برمجة الحاسب بلغة جافا</title>
<meta name="theme-color" content="#0e8a7d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="جافا للمبتدئين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0e8a7d; --teal-d:#0a5f57; --teal-dd:#083f3a;
  --ink:#1d2b31; --muted:#5f7178; --line:#e3ecea;
  --bg:#f6faf9; --card:#ffffff; --tealbg:#eaf5f2; --tealbg2:#dcefe9;
  --amber:#c77d21; --amberbg:#fbf1df; --green:#2e8b57; --greenbg:#e9f6ee;
  --red:#c0492f; --redbg:#fbeceb; --shadow:0 1px 2px rgba(16,60,55,.06),0 8px 24px rgba(16,60,55,.06);
  --r:14px; --r-sm:10px;
  --sans:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px;-webkit-text-size-adjust:100%;container-type:inline-size;container-name:app}
a{color:var(--teal-d);text-decoration:none}
:focus-visible{outline:3px solid rgba(14,138,125,.45);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:1fr 312px;grid-template-rows:auto 1fr;min-height:100%;
     grid-template-areas:"topbar topbar" "main sidebar"}
.topbar{grid-area:topbar;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--teal),var(--teal-d));
  display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:var(--shadow)}
.brand .mark svg{width:22px;height:22px}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.topbar .spacer{flex:1}
.progress-chip{display:flex;align-items:center;gap:10px;background:var(--tealbg);border:1px solid var(--tealbg2);
  padding:7px 12px;border-radius:999px;font-weight:700;color:var(--teal-d);font-size:13.5px}
.progress-chip .ring{--p:0;width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #cfe4de 0);position:relative}
.progress-chip .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--tealbg)}
.menu-btn{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.menu-btn svg{width:22px;height:22px}

/* ---------- sidebar ---------- */
.sidebar{grid-area:sidebar;border-inline-start:1px solid var(--line);background:#fbfdfc;
  padding:18px 14px;overflow-y:auto;position:sticky;top:65px;height:calc(100vh - 65px)}
.side-title{font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 8px 10px}
.toc{list-style:none;display:flex;flex-direction:column;gap:4px}
.toc li a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink);
  font-weight:500;font-size:14.5px;transition:background .15s}
.toc li a:hover{background:var(--tealbg)}
.toc li a.active{background:var(--teal);color:#fff;box-shadow:var(--shadow)}
.toc li a.active .idx{background:rgba(255,255,255,.22);color:#fff}
.toc .idx{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--tealbg);color:var(--teal-d);
  font-weight:800;font-size:13px;display:grid;place-items:center}
.toc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .tick{flex:0 0 auto;width:18px;height:18px;color:var(--green);opacity:0}
.toc li a.done .tick{opacity:1}
.toc li a.active .tick{color:#eafaf3}

/* ---------- main ---------- */
.main{grid-area:main;overflow:hidden}
.wrap{max-width:820px;margin:0 auto;padding:26px 22px 90px}

/* home */
.hero{background:linear-gradient(160deg,var(--teal-d),var(--teal));color:#fff;border-radius:20px;padding:34px 30px;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-80px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
.hero .kick{font-size:14px;font-weight:700;color:#bfe9e0;margin-bottom:8px}
.hero h2{font-size:30px;font-weight:800;line-height:1.3;margin-bottom:10px}
.hero p{font-size:16px;color:#e6f6f2;max-width:56ch}
.hero .cta{display:inline-flex;align-items:center;gap:9px;margin-top:20px;background:#fff;color:var(--teal-d);
  font-weight:800;padding:12px 22px;border-radius:12px;font-size:15.5px;cursor:pointer;border:0}
.hero .cta svg{width:18px;height:18px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:24px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;
  display:flex;gap:13px;align-items:flex-start;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.tcard .n{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--tealbg);color:var(--teal-d);
  font-weight:800;display:grid;place-items:center}
.tcard h4{font-size:15px;font-weight:700;line-height:1.5}
.tcard p{font-size:12.5px;color:var(--muted)}
.section-head{margin:26px 4px 12px;font-size:15px;font-weight:800;color:var(--muted)}

/* lesson content */
.lesson-top{margin-bottom:18px}
.lesson-top .kick{font-size:13.5px;font-weight:700;color:var(--teal)}
.lesson-top h2{font-size:27px;font-weight:800;margin-top:2px}
.lesson-top .sub{color:var(--muted);font-weight:500;margin-top:3px}
.rule{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--teal-d),transparent);margin:14px 0 22px}
h3.sec{font-size:21px;font-weight:800;color:var(--teal-d);margin:28px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:baseline}
h3.sec .num{color:var(--teal);font-weight:800}
.lesson p{font-size:16px;margin:0 0 12px}
.lesson ul.b{list-style:none;margin:6px 0 14px}
.lesson ul.b li{position:relative;padding-inline-start:22px;margin:7px 0}
.lesson ul.b li::before{content:"";position:absolute;inset-inline-start:2px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.callout{border-radius:12px;padding:13px 16px;margin:12px 0;border-inline-start:5px solid var(--teal);background:var(--tealbg)}
.callout .lb{font-weight:800;color:var(--teal-d);margin-bottom:3px;font-size:14.5px}
.callout.amber{border-color:var(--amber);background:var(--amberbg)} .callout.amber .lb{color:#8a5a12}
.callout.green{border-color:var(--green);background:var(--greenbg)} .callout.green .lb{color:#1f6b41}
.callout.red{border-color:var(--red);background:var(--redbg)} .callout.red .lb{color:#8f3220}
.banner{background:linear-gradient(140deg,var(--teal),var(--teal-d));color:#fff;border-radius:14px;padding:18px;text-align:center;margin:14px 0}
.banner .a{font-size:21px;font-weight:800}
.banner .e{font-size:14px;color:#cdeee7;font-style:italic;margin-top:3px}
code.inline{font-family:var(--mono);background:var(--tealbg);color:var(--teal-d);padding:1px 6px;border-radius:6px;font-size:.9em;direction:ltr;unicode-bidi:isolate}

/* code runner */
.runner{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0;background:var(--card);box-shadow:var(--shadow)}
.runner .rh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0f2b33;color:#cfeae4}
.runner .rh .dot{width:11px;height:11px;border-radius:50%}
.runner .rh .title{font-size:13.5px;font-weight:700;color:#9fd7cd;margin-inline-start:6px}
.runner .rh .spc{flex:1}
.runner .rh button{font-family:var(--sans);font-weight:800;font-size:13.5px;border:0;border-radius:9px;cursor:pointer;
  padding:8px 16px;display:inline-flex;align-items:center;gap:7px}
.btn-run{background:#37c99a;color:#04231b} .btn-run:hover{background:#43d6a6}
.btn-reset{background:rgba(255,255,255,.12);color:#dff3ee}
.btn-open{background:rgba(255,255,255,.12);color:#dff3ee;display:inline-flex;align-items:center;gap:6px}
.btn-open:hover{background:rgba(255,255,255,.2)}
.btn-open svg{width:14px;height:14px}
/* line/flat figures */
.fig{margin:18px 0;text-align:center}
.fig svg{max-width:100%;height:auto;display:inline-block}
.fig .box{fill:var(--tealbg);stroke:var(--teal);stroke-width:2}
.fig .boxln{fill:#fff;stroke:var(--teal);stroke-width:2}
.fig .lbl{fill:var(--teal-d);font-family:var(--sans);font-weight:800}
.fig .sub{fill:var(--muted);font-family:var(--mono);font-size:12px}
.fig .arrow{stroke:var(--teal);stroke-width:2;fill:none}
.fig .head{fill:var(--teal)}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.termw{fill:#0f2b33} .termbar{fill:#123a41} .termtxt{font-family:var(--mono);font-size:14px}
.runner textarea{width:100%;border:0;resize:vertical;min-height:120px;padding:14px 16px;font-family:var(--mono);
  font-size:14px;line-height:1.7;direction:ltr;text-align:left;background:#0f2b33;color:#e7f3f0;tab-size:4}
.runner textarea:focus{outline:none}
.out{border-top:1px solid #1d3a41;background:#0b2027;color:#dbeee9;font-family:var(--mono);font-size:13.5px;
  direction:ltr;text-align:left;padding:12px 16px;white-space:pre-wrap;min-height:44px;display:none}
.out.show{display:block}
.out .ok{color:#7ee0b3} .out .err{color:#ff9d8a} .out .meta{color:#6f9088}
.stdin{border-top:1px solid #1d3a41;background:#0e2830;padding:9px 14px}
.stdin-lb{display:block;color:#8fb3ab;font-size:12px;margin-bottom:5px;font-family:var(--sans)}
.stdin textarea{width:100%;min-height:46px;background:#0b2027;color:#e7f3f0;border:1px solid #22454f;border-radius:8px;font-family:var(--mono);font-size:13px;padding:8px;direction:ltr;text-align:left;resize:vertical}
.spin{width:15px;height:15px;border:2.5px solid rgba(4,35,27,.25);border-top-color:#04231b;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* worksheet */
.ws{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px 18px 8px;box-shadow:var(--shadow)}
.ws .q{padding:14px 0;border-bottom:1px dashed var(--line)}
.ws .q:last-child{border-bottom:0}
.ws .qh{font-weight:700;margin-bottom:10px}
.ws .qh .qn{color:var(--teal);font-weight:800;margin-inline-end:6px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--teal)}
.opt input{accent-color:var(--teal);width:17px;height:17px;flex:0 0 auto}
.opt.code{direction:ltr;justify-content:flex-start;font-family:var(--mono);font-size:14px}
.opt.correct{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt .tag{margin-inline-start:auto;font-size:12px;font-weight:800}
.opt.correct .tag{color:var(--green)} .opt.wrong .tag{color:var(--red)}
.ws .fill input{font-family:var(--mono);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;min-width:120px;direction:ltr;text-align:left}
.ws-actions{display:flex;align-items:center;gap:12px;padding:14px 0 6px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-weight:800;border:0;border-radius:11px;cursor:pointer;padding:11px 20px;font-size:15px}
.btn-primary{background:var(--teal);color:#fff} .btn-primary:hover{background:var(--teal-d)}
.btn-ghost{background:var(--tealbg);color:var(--teal-d)}
.scorebox{font-weight:800;color:var(--teal-d);background:var(--tealbg);padding:9px 16px;border-radius:10px;display:none}
.scorebox.show{display:inline-block}

/* lesson nav */
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.lnav button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;
  text-align:start;font-family:var(--sans);transition:border-color .15s}
.lnav button:hover:not(:disabled){border-color:var(--teal)}
.lnav button:disabled{opacity:.4;cursor:default}
.lnav .lbl{font-size:12px;color:var(--muted);font-weight:600}
.lnav .ttl{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:2px}
.mark-read{display:flex;align-items:center;gap:10px;margin-top:22px;background:var(--tealbg);border:1px dashed var(--tealbg2);
  border-radius:12px;padding:12px 16px}
.mark-read label{font-weight:700;color:var(--teal-d);display:flex;align-items:center;gap:10px;cursor:pointer}
.mark-read input{width:20px;height:20px;accent-color:var(--teal)}

.badge-soon{font-size:11px;background:var(--amberbg);color:#8a5a12;font-weight:700;padding:2px 8px;border-radius:999px}

/* overlay for mobile drawer */
.scrim{display:none;position:fixed;inset:0;background:rgba(10,40,36,.4);z-index:45}
.scrim.show{display:block}

/* footer note */
.foot{max-width:820px;margin:10px auto 0;padding:0 22px 28px;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;inset-block:0;inset-inline-end:0;width:300px;height:100vh;z-index:50;
    transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(10,40,36,.15)}
  .sidebar.open{transform:translateX(0)}
  .progress-chip .lbl{display:none}
}
@media (max-width:560px){
  .wrap{padding:18px 15px 80px}
  .hero{padding:26px 20px} .hero h2{font-size:24px}
  .brand h1{font-size:15.5px} .brand span{display:none}
  h3.sec{font-size:19px}
}
/* ---- Container Queries: تستجيب لعرض الإطار الفعلي لا الشاشة ---- */
@container app (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;inset-block:0;inset-inline-end:0;width:300px;height:100vh;z-index:50;
    transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(10,40,36,.15)}
  .sidebar.open{transform:translateX(0)}
  .progress-chip .lbl{display:none}
}
@container app (max-width:560px){
  .wrap{padding:18px 15px 80px}
  .hero{padding:26px 20px} .hero h2{font-size:24px}
  .brand h1{font-size:15.5px} .brand span{display:none}
  h3.sec{font-size:19px}
}
/* ---- وضع الجوّال المُفعّل بالـJavaScript (يعمل في أي إطار) ---- */
body.cq-mobile .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
body.cq-mobile .menu-btn{display:inline-flex}
body.cq-mobile .sidebar{position:fixed;inset-block:0;inset-inline-end:0;width:300px;height:100vh;z-index:50;
  transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(10,40,36,.15)}
body.cq-mobile .sidebar.open{transform:translateX(0)}
body.cq-mobile .progress-chip .lbl{display:none}
.prebox{direction:ltr;text-align:left;background:#0f2b33;color:#e7f3f0;font-family:var(--mono);font-size:14px;
  line-height:1.7;padding:14px 16px;border-radius:12px;overflow-x:auto;margin:14px 0;white-space:pre;tab-size:4}
.dtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dtable th{background:var(--teal);color:#fff;font-weight:800;padding:10px 12px;text-align:right}
.dtable td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top}
.dtable tr:nth-child(even) td{background:var(--tealbg)}
.dtable td code, .dtable th code{direction:ltr;unicode-bidi:isolate}
.qsec{font-weight:800;color:var(--teal-d);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.qlabel{color:var(--muted);font-weight:600;font-size:12.5px}
.reveal{margin-top:8px;background:var(--tealbg);color:var(--teal-d);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.reveal:hover{background:var(--tealbg2)}
.model{margin-top:8px;background:var(--greenbg);border:1px solid #bfe0cd;border-radius:8px;padding:8px 12px;color:#1f6b41;direction:rtl}
.model .modlb{font-weight:800}
.matchg{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.mcol{flex:1;min-width:230px;display:flex;flex-direction:column;gap:8px}
.rightcol{background:var(--tealbg);border-radius:10px;padding:10px 12px}
.mrow{display:flex;align-items:center;gap:10px}
.mletter{width:46px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:7px;font-family:var(--mono)}
.mval{font-weight:700}
.mval.code{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:14px}
.rrow{padding:5px 4px}
.ws .fill input[data-self]{min-width:60%}
bdi.ltr{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="فتح قائمة المواضيع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand" role="button" id="homeBtn" tabindex="0" aria-label="الصفحة الرئيسة">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 8 4 12 8 16"/><polyline points="16 8 20 12 16 16"/><line x1="13.5" y1="6" x2="10.5" y2="18"/></svg></div>
      <div><h1>أساسيات برمجة الحاسب</h1><span>بلغة جافا — منصّة الطالب</span></div>
    </div>
    <div class="spacer"></div>
    <div class="progress-chip" title="نسبة إتمام الدروس">
      <span class="ring" id="ring"></span><span class="lbl">التقدّم</span><span id="pct">0%</span>
    </div>
  </header>

  <main class="main">
    <div class="wrap" id="view"></div>
    <div class="foot">
      كلية التقنية بالمدينة المنورة — المقرر: أساسيات برمجة الحاسب — المدرّب: سعود الحازمي
      <br>نموذج تجريبي (المرحلة الأولى): يُحفظ تقدّمك على هذا الجهاز.
    </div>
  </main>

  <aside class="sidebar" id="sidebar" aria-label="قائمة المواضيع">
    <div class="side-title">مواضيع المقرر</div>
    <ul class="toc" id="toc"></ul>
  </aside>
</div>
<div class="scrim" id="scrim"></div>

<script>
/* ============================================================
   مُشغِّل جافا تعليمي (Java-subset interpreter) — يعمل في المتصفّح بلا إنترنت
   يغطّي: الطباعة، المتغيّرات (int/double/char/boolean/String)، العمليات

/* ---------- Values & helpers ---------- */
const V={ int:v=>({t:"int",v}), dbl:v=>({t:"double",v}), bool:v=>({t:"boolean",v}),

/* ---------- Interpreter ---------- */

    switch(fn){
      case"max": return (a[0].t==="double"||a[1].t==="double")?V.dbl(Math.max(n[0],n[1])):V.int(Math.max(n[0],n[1]));
      case"min": return (a[0].t==="double"||a[1].t==="double")?V.dbl(Math.min(n[0],n[1])):V.int(Math.min(n[0],n[1]));
      case"abs": return a[0].t==="double"?V.dbl(Math.abs(n[0])):V.int(Math.abs(n[0]));
      case"round": return V.int(Math.round(n[0]));
      case"sqrt": return V.dbl(Math.sqrt(n[0]));
      case"pow": return V.dbl(Math.pow(n[0],n[1]));
      case"floor": return V.dbl(Math.floor(n[0]));
      case"ceil": return V.dbl(Math.ceil(n[0]));
      case"random": return V.dbl(Math.random());
      default: throw {msg:"دالة Math غير مدعومة: "+fn};
    }
  }
  function methodCall(obj,m,args){
    if(obj.t==="scanner"){
      switch(m){ case"nextInt": return V.int(parseInt(readToken()||"0",10)||0);
        case"nextDouble": return V.dbl(parseFloat(readToken()||"0")||0);
        case"next": return V.str(readToken()||"");
        case"nextLine": return V.str(readLine());
        case"close": return V.nul();
        default: throw {msg:"دالة Scanner غير مدعومة: "+m}; }
    }
    if(obj.t==="String"){ const s=obj.v; const A=args;
      switch(m){
        case"length": return V.int(s.length);
        case"toUpperCase": return V.str(s.toUpperCase());
        case"toLowerCase": return V.str(s.toLowerCase());
        case"charAt": return V.chr(s.charCodeAt(num(A[0])));
        case"substring": return V.str(A.length>1?s.substring(num(A[0]),num(A[1])):s.substring(num(A[0])));
        case"indexOf": return V.int(s.indexOf(javaStr(A[0])));
        case"contains": return V.bool(s.includes(javaStr(A[0])));
        case"replace": return V.str(s.split(javaStr(A[0])).join(javaStr(A[1])));
        case"trim": return V.str(s.trim());
        case"equals": return V.bool(A[0].t==="String"&&s===A[0].v);
        case"equalsIgnoreCase": return V.bool(A[0].t==="String"&&s.toLowerCase()===A[0].v.toLowerCase());
        case"isEmpty": return V.bool(s.length===0);
        case"concat": return V.str(s+javaStr(A[0]));
        default: throw {msg:"دالة String غير مدعومة: "+m};
      }
    }
    throw {msg:"استدعاء دالة على قيمة غير مدعومة."};
  }

  run(ast);
  return out;
}

function runJava(source, stdin){
  try{
    const toks=tokenize(source);
    const ast=parse(toks);
    const output=interpret(ast, stdin||"");
    return {out:output, err:""};
  }catch(e){
    return {out:"", err:(e&&e.msg)?e.msg:String(e&&e.message||e)};
  }
}

global.runJava=runJava;
if(typeof module!=="undefined"&&module.exports) module.exports={runJava};
})(typeof window!=="undefined"?window:globalThis);

function bidiEsc(t){t=String(t==null?"":t);const re=/[A-Za-z0-9_$<>=!&|][A-Za-z0-9_$ ().,;:{}\[\]<>=!%&|+\-*/"’'.]*[A-Za-z0-9_$)\]}>=!|"']|[A-Za-z0-9_$]/g;let out="",last=0,m;while((m=re.exec(t))){out+=esc(t.slice(last,m.index));out+=`<bdi class="ltr">${esc(m[0])}</bdi>`;last=m.index+m[0].length;}out+=esc(t.slice(last));return out;}

  }
  else if(name==="loop-cycle"){
    svg=`<svg viewBox="0 0 460 210" role="img" aria-label="دورة الحلقة">

let runnerSeq=0;

function quizHTML(l){
  const Q=(typeof QUIZ!=="undefined"&&QUIZ[l.id])||[];
  if(!Q.length)return"";
  const saved=store.get(l.id).quiz;
  const LET=["أ","ب","ج","د","هـ","و","ز"];
  let n=0;
  const parts=Q.map((it,idx)=>{
    if(it.k==="sec") return `<div class="qsec">${esc(it.t)}</div>`;
    n++;
    const head=(lab)=>`<div class="qh"><span class="qn">${toAr(n)})</span> ${bidiEsc(it.q||"")} ${lab?`<span class="qlabel">${lab}</span>`:""}</div>`;
    if(it.k==="mcq"||it.k==="choose"){

      return `<div class="q" data-i="${idx}">${head(it.k==="choose"?"(اختر)":"(اختيار)")}${opts}</div>`;
    }
    if(it.k==="tf"){
      const opts=["صح","خطأ"].map((o,j)=>`<label class="opt" data-i="${idx}" data-j="${j}"><input type="radio" name="q${idx}"><span>${o}</span><span class="tag"></span></label>`).join("");
      return `<div class="q" data-i="${idx}">${head("(صح/خطأ)")}${opts}</div>`;
    }
    if(it.k==="fill"){
      return `<div class="q" data-i="${idx}">${head("(أكمل)")}<div class="fill">الإجابة: <input type="text" data-fill="${idx}" autocomplete="off"><span class="tag" data-tag="${idx}"></span></div></div>`;
    }
    if(it.k==="self"){

    }
    if(it.k==="trace"){
      return `<div class="q" data-i="${idx}">${head("(تتبّع — تحقّق ذاتي)")}<pre class="prebox">${esc(it.code)}</pre><div class="fill">توقّعك: <input type="text" data-self="${idx}" autocomplete="off"></div><button class="reveal" data-reveal="${idx}">أظهر الناتج</button><div class="model" data-model="${idx}" hidden><span class="modlb">الناتج:</span> ${bidiEsc(it.out).replace(/\n/g,"<br>")}</div></div>`;

      const left=it.left.map((a,r)=>`<div class="mrow"><input class="mletter" data-match="${idx}" data-row="${r}" maxlength="2" autocomplete="off"><span class="mval ${a.c!==undefined?'code':''}">${esc(a.c!==undefined?a.c:a.t)}</span><span class="tag" data-mtag="${idx}-${r}"></span></div>`).join("");
      const right=it.right.map(b=>`<div class="rrow">${bidiEsc(b)}</div>`).join("");
      return `<div class="q" data-i="${idx}">${head("(توصيل — اكتب الحرف)")}<div class="matchg"><div class="mcol">${left}</div><div class="mcol rightcol">${right}</div></div></div>`;
    }
    return "";
  }).join("");
  return `<h3 class="sec"><span>ورقة عمل الدرس</span></h3>
    <p style="color:var(--muted)">أجب عن الأسئلة ثم اضغط «تحقّق». الأسئلة العملية «تحقّق ذاتي» تُظهر لك النموذج/الناتج.</p>
    <div class="ws" id="ws">${parts}
      <div class="ws-actions">
        <button class="btn btn-primary" id="checkBtn">تحقّق من الإجابات</button>
        <button class="btn btn-ghost" id="resetQuiz">إعادة المحاولة</button>
        <span class="scorebox ${saved?'show':''}" id="score">${saved?`درجتك السابقة: ${saved.score} / ${saved.total}`:''}</span>
      </div>
    </div>`;
}

function navHTML(id){
  const prev=LESSONS.find(x=>x.id===id-1), next=LESSONS.find(x=>x.id===id+1);
  return `<div class="lnav">
    <button ${prev?`data-go="${prev.id}"`:"disabled"}><div class="lbl">◄ السابق</div><div class="ttl">${prev?esc(prev.title):"—"}</div></button>
    <button ${next?`data-go="${next.id}"`:"disabled"}><div class="lbl">التالي ►</div><div class="ttl">${next?esc(next.title):"—"}</div></button>
  </div>`;
}

/* ---------- code runner (مُشغّل محلي داخل المتصفّح — بلا إنترنت) ---------- */
function bindRunners(){
  document.querySelectorAll(".runner").forEach(r=>{
    const ta=r.querySelector("[data-code]"), out=r.querySelector("[data-out]"), orig=ta.value;
    const stdinEl=r.querySelector("[data-stdin]");
    const grow=()=>{ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; };
    ta.style.overflowY="hidden"; requestAnimationFrame(grow); ta.addEventListener("input",grow);
    r.querySelector('[data-act="reset"]').onclick=()=>{ta.value=orig;if(stdinEl)stdinEl.value="";out.className="out";out.innerHTML="";grow();};
    const openBtn=r.querySelector('[data-act="open"]');
    if(openBtn) openBtn.onclick=()=>{
      const code=ta.value;
      const done=()=>{ out.className="out show"; out.innerHTML='<span class="meta">تم نسخ الكود. الصقه (Ctrl+V) في المحرّر الذي فُتح: onecompiler.com/java</span>'; };
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done,()=>done()); }
        else{ const t=document.createElement("textarea"); t.value=code; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(t); done(); }
      }catch(e){ done(); }
      window.open("https://onecompiler.com/java","_blank","noopener");
    };
    ta.addEventListener("keydown",e=>{ if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+"    "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+4;}});
    r.querySelector('[data-act="run"]').onclick=()=>{
      out.className="out show";
      let res; try{ res=runJava(ta.value, stdinEl?stdinEl.value:""); }catch(e){ res={out:"",err:"خطأ غير متوقّع: "+e.message}; }
      if(res.err) out.innerHTML=`<span class="err">${esc(res.err)}</span>`;
      else out.innerHTML=res.out? `<span class="ok">${esc(res.out)}</span>` : `<span class="meta">(نُفّذ البرنامج دون ناتج)</span>`;
      const id=curLesson; if(id){store.set(id,{runs:store.get(id).runs+1});}
    };
  });
}
/* ---------- quiz grading ---------- */
function bindQuiz(l){
  const Q=(typeof QUIZ!=="undefined"&&QUIZ[l.id])||[]; const ws=$("#ws"); if(!ws||!Q.length)return;
  const LET=["أ","ب","ج","د","هـ","و","ز"];
  const norm=s=>(s||"").trim().replace(/\s+/g," ");
  ws.querySelectorAll(".opt").forEach(op=>op.onclick=()=>{const r=op.querySelector("input");if(r)r.checked=true;});
  ws.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{const m=ws.querySelector(`[data-model="${b.getAttribute("data-reveal")}"]`);if(m)m.hidden=!m.hidden;});
  $("#checkBtn").onclick=()=>{
    let correct=0,total=0;
    Q.forEach((it,idx)=>{
      if(it.k==="mcq"||it.k==="choose"||it.k==="tf"){
        total++;
        const opts=[...ws.querySelectorAll(`.opt[data-i="${idx}"]`)];
        opts.forEach(o=>{o.classList.remove("correct","wrong");o.querySelector(".tag").textContent="";});
        const ans=it.k==="tf"?(it.ans?0:1):it.ans;
        if(opts[ans]){opts[ans].classList.add("correct");opts[ans].querySelector(".tag").textContent="✔";}
        const sel=ws.querySelector(`input[name="q${idx}"]:checked`);
        if(sel){const j=opts.findIndex(o=>o.contains(sel)); if(j===ans)correct++; else if(opts[j]){opts[j].classList.add("wrong");opts[j].querySelector(".tag").textContent="✗";}}
      } else if(it.k==="fill"){
        total++;
        const inp=ws.querySelector(`[data-fill="${idx}"]`), tag=ws.querySelector(`[data-tag="${idx}"]`);
        const val=norm(inp.value), ok=val!=="" && it.ans.some(a=>norm(a)===val);
        inp.style.borderColor=ok?"var(--green)":"var(--red)"; tag.textContent=ok?"✔":("✗  "+it.ans[0]); tag.style.color=ok?"var(--green)":"var(--red)";
        if(ok)correct++;
      } else if(it.k==="match"){
        it.ans.forEach((bi,r)=>{ total++;
          const inp=ws.querySelector(`[data-match="${idx}"][data-row="${r}"]`), tag=ws.querySelector(`[data-mtag="${idx}-${r}"]`);
          const want=LET[bi], got=norm(inp.value).replace(/[.\s]/g,"");
          const ok=got!=="" && got===norm(want).replace(/[.\s]/g,"");
          inp.style.borderColor=ok?"var(--green)":"var(--red)"; tag.textContent=ok?"✔":("✗ "+want); tag.style.color=ok?"var(--green)":"var(--red)";
          if(ok)correct++;
        });
      }
    });
    ws.querySelectorAll("[data-model]").forEach(m=>m.hidden=false); // reveal self/trace models
    const sb=$("#score"); sb.classList.add("show"); sb.textContent=`درجتك: ${correct} / ${total}`;
    store.set(l.id,{quiz:{score:correct,total,date:Date.now()}});
    const first=$("#score"); if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
  };
  $("#resetQuiz").onclick=()=>renderLesson(l.id);
}

/* ---------- sidebar / progress ---------- */
function buildTOC(){
  $("#toc").innerHTML=LESSONS.map(l=>{
    const p=store.get(l.id);
    return `<li><a href="#" data-go="${l.id}" class="${p.read?'done':''}">
      <span class="idx">${toAr(l.id)}</span><span class="t">${esc(l.title)}</span>
      <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </a></li>`;
  }).join("");
}
function setActive(id){
  document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("active",+a.dataset.go===id));
}
function updateProgress(){
  const ready=LESSONS.filter(l=>!l.soon);
  const done=ready.filter(l=>store.get(l.id).read).length;
  const pct=Math.round(done/LESSONS.length*100);
  $("#pct").textContent=pct+"%"; $("#ring").style.setProperty("--p",pct);
  document.querySelectorAll(".toc a").forEach(a=>{ if(store.get(+a.dataset.go).read)a.classList.add("done"); });
}
function toAr(n){return String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);}

/* ---------- routing ---------- */
let curLesson=null;
function go(id){ curLesson=id?+id:null; closeDrawer();
  if(id) renderLesson(+id); else renderHome();
  history.replaceState({},"","#"+(id?("درس-"+id):"")); }
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();go(g.dataset.go);} });
$("#homeBtn").addEventListener("click",()=>go(null));
$("#homeBtn").addEventListener("keydown",e=>{if(e.key==="Enter")go(null);});

/* ---------- mobile drawer ---------- */
const sb=$("#sidebar"),scrim=$("#scrim");
function openDrawer(){sb.classList.add("open");scrim.classList.add("show");}
function closeDrawer(){sb.classList.remove("open");scrim.classList.remove("show");}
$("#menuBtn").addEventListener("click",openDrawer);
scrim.addEventListener("click",closeDrawer);
/* حلّ حاسم للاستجابة: نقيس العرض الحقيقي ونبدّل الوضع بأنفسنا (يعمل في أي إطار) */
function applyResponsive(w){
  const mobile = w < 900;
  document.body.classList.toggle("cq-mobile", mobile);
  if(!mobile) closeDrawer();
}
if("ResizeObserver" in window){
  const ro=new ResizeObserver(entries=>{ for(const e of entries){ applyResponsive(e.contentRect.width); } });
  ro.observe(document.body);
}
window.addEventListener("resize",()=>applyResponsive(document.body.clientWidth));
applyResponsive(document.body.clientWidth);

/* ---------- init ---------- */
function start(){ buildTOC(); updateProgress(); const m=location.hash.match(/درس-(\d+)/); if(m)go(m[1]); else renderHome(); }
const FIGS={2:"struct-nest",3:"var-boxes",7:"if-flow",9:"loop-cycle",10:"loop-cycle",13:"array-cells"};
async function boot(){
  try{
    const [ls,qs]=await Promise.all([fetch("data/lessons.json").then(r=>r.json()), fetch("data/quizzes.json").then(r=>r.json())]);
    QUIZ=qs;
    LESSONS=Object.keys(ls).map(Number).sort((a,b)=>a-b).map(id=>{
      const c=ls[id]; let blocks=(c.blocks||[]).slice();
      if(FIGS[id] && !blocks.some(b=>b.t==="fig")){ const hi=blocks.findIndex(b=>b.t==="h"); blocks.splice(hi>=0?hi+1:0,0,{t:"fig",name:FIGS[id]}); }
      return {id, title:c.title, subtitle:c.subtitle||"", blocks};
    });
    start();
  }catch(e){
    document.getElementById("view").innerHTML='<div class="callout amber"><div class="lb">تعذّر تحميل المحتوى</div><div>هذه النسخة تقرأ الدروس من ملفَّي <bdi class="ltr">data/lessons.json</bdi> و <bdi class="ltr">data/quizzes.json</bdi>، ويتطلّب ذلك تشغيل الموقع عبر خادم (لا بالفتح المباشر). داخل المجلد شغّل: <bdi class="ltr">python -m http.server 8000</bdi> ثم افتح <bdi class="ltr">http://localhost:8000</bdi> ، أو ارفعه على استضافة.</div></div>';
    console.error(e);
  }
}
boot();
/* ---------- المرحلة التجريبية: إلغاء أي نسخة مخزّنة قديمة لضمان تحميل أحدث ملف ----------
   (تفعيل PWA/العمل دون اتصال يكون عند الاستضافة النهائية عبر sw.js المرفق) */
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if(window.caches && caches.keys){ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{}); }
</script>
